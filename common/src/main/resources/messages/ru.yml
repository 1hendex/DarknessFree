  type_space: ' '
  type: "&8» &7Категория проверки: &f%checkType%"
  not_found_total: "&8» &cПроверки не найдены."
  not_found_type: "&8» &cОтсутствуют."
  separator: "&7, "
  check_not_found: "%prefix% &cЧек &7'%check%' &cне найден!"
  check_enabled: "%prefix% &fЧек &a%check% &fбыл &aвключен&f!"
